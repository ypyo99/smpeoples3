name: KISA 최신 보안공지 자동 수집

on:
  schedule:
    # 매주 월요일, 목요일 한국시간 오전 09:00 (UTC 00:00) 자동 실행
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # GitHub Actions 탭에서 수동으로 1클릭 실행 가능

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 최신 KISA 보안공지 10건 수집 실행
        run: node scripts/update_news.js

      - name: 변경 사항 확인 및 Git 자동 커밋 & 푸시
        run: |
          if [[ -n $(git status --porcelain data/news.json) ]]; then
            echo "보안뉴스 변경 사항이 감지되었습니다. 자동 커밋을 진행합니다."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "chore: KISA 최신 보안공지 자동 갱신 [skip ci]"
            git push origin main
          else
            echo "새로운 보안공지 변동 사항이 없습니다. 커밋을 생략합니다."
          fi

